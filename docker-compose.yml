# Base PostgreSQL locale du POC Crésus.
# Lancement :  docker compose up -d
# (Alternative sans Docker : installer PostgreSQL 15/16 et créer la base "cresus".)
services:
  postgres:
    image: postgres:16
    container_name: cresus_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cresus
    ports:
      - "5432:5432"
    volumes:
      - cresus_pgdata:/var/lib/postgresql/data
    # Un peu plus de mémoire de travail pour les agrégations (4,3 M de lignes, 42,7 M en gros volume)
    command: ["postgres", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=256MB"]

volumes:
  cresus_pgdata:
