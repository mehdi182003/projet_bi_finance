version: 2

models:
  # ----------------------------------------------------------------- dimensions
  - name: dim_date
    meta:
      type_table: "dimension"
      grain: "1 ligne = 1 jour calendaire"
      remarque: "conforme (partagée par tous les faits)"
    description: Calendrier en français (une ligne par jour).
    columns:
      - name: date_jour
        tests: [unique, not_null]

  - name: dim_filiale
    meta:
      type_table: "dimension"
      grain: "1 ligne = 1 filiale"
      remarque: "conforme ; clé métier stable (SCD type 1) ; aucune mesure (RG-MOD-01)"
    description: >
      Contexte « qui / où » des 10 filiales : identité, pays, région, devise, système bancaire source,
      fuseau horaire, source des dépôts réels. Les chiffres de chaque filiale (part de marché, taux de
      réserve, clients, encours et réserve de départ) sont dans fct_situation_initiale_filiale.
    columns:
      - name: code_filiale
        tests: [unique, not_null]
      - name: code_devise
        tests:
          - relationships:
              arguments: {to: ref('dim_devise'), field: code_devise}

  - name: dim_devise
    meta:
      type_table: "dimension"
      grain: "1 ligne = 1 devise"
      remarque: "conforme ; code ISO 4217"
    description: Référentiel des devises (régime flottant / fixe / référence).
    columns:
      - name: code_devise
        tests: [unique, not_null]

  - name: dim_type_transaction
    meta:
      type_table: "dimension"
      grain: "1 ligne = 1 type d'opération normalisé"
      remarque: "conforme"
    description: Types d'opérations normalisés et leur sens de trésorerie.
    columns:
      - name: code_type
        tests: [unique, not_null]

  - name: dim_scenario_stress
    meta:
      type_table: "dimension"
      grain: "1 ligne = 1 scénario de stress"
      remarque: "conforme ; aucune mesure (RG-MOD-01)"
    description: >
      Contexte « quoi » des 7 scénarios de stress : nom, ordre d'affichage et crise historique de
      référence. Les chocs chiffrés appliqués à chaque filiale sont dans le fait mart_stress_test.
    columns:
      - name: code_scenario
        tests: [unique, not_null]

  # ---------------------------------------------------------------------- faits
  - name: fct_flux_tresorerie_horaire
    meta:
      type_table: "fait transactionnel agrégé"
      grain: "heure x filiale x type x fraude x gros ticket"
      remarque: "mesures additives ; incrémental"
    description: Flux de trésorerie agrégés (heure x filiale x type x fraude x gros ticket).
    columns:
      - name: id_flux
        tests: [unique, not_null]
      - name: code_filiale
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_filiale'), field: code_filiale}
      - name: code_type
        tests:
          - relationships:
              arguments: {to: ref('dim_type_transaction'), field: code_type}
      - name: date_operation
        tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_jour}
      - name: flux_net_eur
        tests: [not_null]

  - name: fct_position_tresorerie_quotidienne
    meta:
      type_table: "fait instantané périodique (snapshot)"
      grain: "jour x filiale"
      remarque: "positions et encours SEMI-additifs (pas de somme dans le temps)"
    description: Position de trésorerie de clôture par jour et par filiale (semi-additive dans le temps).
    columns:
      - name: id_position
        tests: [unique, not_null]
      - name: code_filiale
        tests:
          - relationships:
              arguments: {to: ref('dim_filiale'), field: code_filiale}
      - name: date_position
        tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_jour}
      - name: taux_eur_jour
        description: Un taux manquant ici signifie qu'il manque une cotation BCE sur la période.
        tests: [not_null]
      - name: position_cloture_eur
        tests: [not_null]

  - name: fct_situation_initiale_filiale
    meta:
      type_table: "fait instantané (situation de départ)"
      grain: "1 ligne = 1 filiale au 31/12/2022"
      remarque: "montants EUR additifs entre filiales ; devise locale et % non additifs"
    description: >
      Chiffres de départ et paramètres de pilotage de chaque filiale (part de marché, taux de réserve
      cible, encours de dépôts et réserve initiaux). Sortis de dim_filiale (RG-MOD-01).
    columns:
      - name: id_situation
        tests: [unique, not_null]
      - name: code_filiale
        tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('dim_filiale'), field: code_filiale}
      - name: encours_depots_initial_eur
        tests: [not_null]

  - name: fct_taux_change
    meta:
      type_table: "fait instantané périodique"
      grain: "jour x devise"
      remarque: "taux NON additifs"
    description: Taux EUR->devise quotidiens, variation et volatilité (annualisée sur 60 cotations).
    columns:
      - name: id_taux
        tests: [unique, not_null]
      - name: date_cours
        tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_jour}

  # ------------------------------------------------------------------- analyses
  - name: mart_exposition_change
    meta:
      type_table: "fait agrégé (analyse)"
      grain: "jour x devise"
      remarque: "exposition et VaR semi-additives par devise ; %, taux et ratios non additifs"
    description: >
      Exposition au risque de change par devise, VaR paramétrique 95 % (1 j et 10 j),
      coût de couverture, rapport coût / risque et recommandation de couverture.
    columns:
      - name: id_exposition
        tests: [unique, not_null]
      - name: recommandation_couverture
        tests: [not_null]

  - name: mart_liquidite_placement
    meta:
      type_table: "fait instantané périodique (analyse)"
      grain: "jour x filiale"
      remarque: "montants EUR semi-additifs ; ratios et jours non additifs"
    description: >
      Ratio de liquidité Bâle III simplifié, consommation quotidienne, jours avant passage sous 100 %,
      liquidité excédentaire / besoin de refinancement (par rapport au seuil de pilotage), coûts et gains.
    columns:
      - name: id_liquidite
        tests: [unique, not_null]
      - name: ratio_couverture_liquidite_pct
        tests: [not_null]
      - name: jours_avant_seuil_100pct
        description: 0 si le ratio est déjà sous 100 % ; NULL si la position ne baisse pas.

  - name: mart_qualite_sources
    meta:
      type_table: "fait agrégé (qualité)"
      grain: "système x filiale x mois"
      remarque: "comptages additifs ; taux de rejet non additif"
    description: Défauts des exports bruts détectés et corrigés par l'ETL, par système, filiale et mois.
    columns:
      - name: id_qualite_source
        tests: [unique, not_null]

  - name: mart_qualite_defauts
    meta:
      type_table: "fait agrégé (qualité)"
      grain: "système x filiale x mois x type de défaut"
      remarque: "nb_lignes additif"
    description: >
      Catalogue des défauts des exports (une ligne par système, filiale, mois et type de défaut), avec le
      traitement appliqué : ligne écartée (motif de rejet) ou valeur corrigée (ligne conservée).
    columns:
      - name: id_defaut
        tests: [unique, not_null]
      - name: traitement
        tests:
          - accepted_values:
              arguments:
                values: ['Ligne écartée', 'Valeur corrigée']

  - name: mart_qualite_ancrage
    meta:
      type_table: "fait instantané (contrôle)"
      grain: "filiale x date publiée par la banque centrale"
      remarque: "encours semi-additifs ; écart % non additif"
    description: >
      Fiabilité : à chaque date publiée par une banque centrale, encours réel (x part de marché) vs encours
      reconstitué par cumul des flux quotidiens. Écart attendu : nul.
    columns:
      - name: id_ancrage
        tests: [unique, not_null]
      - name: ecart_pct
        tests: [not_null]

  - name: mart_stress_test
    meta:
      type_table: "fait de simulation"
      grain: "scénario x filiale à la date d'arrêté"
      remarque: "montants EUR additifs entre filiales ; jours et % non additifs"
    description: Résultat des scénarios de stress par filiale à la date d'arrêté.
    columns:
      - name: id_stress
        tests: [unique, not_null]
      - name: statut_resilience
        tests:
          - accepted_values:
              arguments:
                values: ['1 - Résilient', '2 - Vigilance', '3 - Critique']

  # ------------------------------------------------------------------ prévision
  - name: mart_prevision_tresorerie
    meta:
      type_table: "fait de prévision"
      grain: "jour x filiale (historique + horizon)"
      remarque: "positions semi-additives ; probabilité non additive"
    description: Position réalisée + projection (P5 / P50 / P95) issue de la simulation Monte-Carlo.
    columns:
      - name: id_prevision
        tests: [unique, not_null]
  - name: mart_prevision_change
    meta:
      type_table: "fait de prévision"
      grain: "jour x devise"
      remarque: "taux non additifs"
    description: Taux historiques + fourchette de prévision et contrôle a posteriori.
    columns:
      - name: id_prevision_change
        tests: [unique, not_null]
  - name: mart_controle_a_posteriori
    meta:
      type_table: "fait de contrôle"
      grain: "filiale x date de contrôle"
      remarque: "dépôts semi-additifs ; erreur % non additive"
    description: Prévision des dépôts au 31/01/2026 vs encours réels publiés ensuite (test hors échantillon).
    columns:
      - name: id_controle
        tests: [unique, not_null]
      - name: dans_la_fourchette
        description: Oui si le dépôt réel tombe dans la fourchette P5-P95 prévue, sinon Non.
  - name: mart_reserve_optimale
    meta:
      type_table: "fait de prévision"
      grain: "filiale à la date d'arrêté"
      remarque: "montants EUR additifs ; % et probabilités non additifs"
    description: Réserve requise (P99) vs réserve actuelle par filiale, liquidité libérable et gain annuel au taux réel.
    columns:
      - name: id_reserve
        tests: [unique, not_null]
  - name: mart_backtest_journalier
    meta:
      type_table: "fait de prévision"
      grain: "origine x filiale x série x modèle x jour"
      remarque: "réel et prévu additifs sur les jours ; WAPE à recalculer"
    description: Réel vs prévu, jour par jour, sur la période de backtest.
    columns:
      - name: id_backtest
        tests: [unique, not_null]
