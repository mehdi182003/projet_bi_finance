version: 2

models:
  - name: stg_paysim__transactions
    description: Transactions PaySim nettoyées, horodatées sur la période rejouée (var date_debut_paysim).
    columns:
      - name: id_transaction
        tests: [unique, not_null]
      - name: step_heure
        tests:
          - not_null
          - entre_bornes:
              arguments:
                min_value: 1
                max_value: 744
      - name: code_type
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ref_types_transaction')
                field: code_type
      - name: montant_paysim
        tests:
          - not_null
          - entre_bornes:
              arguments:
                min_value: 0
      - name: id_client_emetteur
        tests: [not_null]

  - name: stg_bce__taux_change
    description: Cours de référence BCE sur la profondeur d'historique retenue.
    tests:
      - unicite_combinee:
          arguments:
            colonnes: [date_cours, code_devise]
    columns:
      - name: taux_eur
        tests: [not_null]
