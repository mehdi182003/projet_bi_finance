version: 2

sources:
  - name: raw
    description: Données brutes chargées par Python (etl/chargement_raw.py), sans transformation.
    schema: raw
    tables:
      # --- Exports bruts des systèmes des filiales (zone bronze : tout en texte, tel que reçu)
      - name: src_sab
        description: Exports SAB (France, Benelux, Finlande), chargés tels quels par etl/chargement_sources_internes.py.
        columns:
          - name: ref_ope
            tests: [not_null]
      - name: src_nordic
        description: Exports Nordic Core Banking (Suède, Danemark, Norvège), horodatages en UTC.
        columns:
          - name: txn_id
            tests: [not_null]
      - name: src_americore
        description: Exports AmeriCore (Canada, États-Unis), colonnes débit / crédit séparées.
        columns:
          - name: txnref
            tests: [not_null]
      - name: src_delta
        description: Exports DELTA (Côte d'Ivoire, Cameroun), avec ligne de titre et ligne de total de contrôle.
        columns:
          - name: numope
            tests: [not_null]
      - name: journal_chargement
        description: Un enregistrement par fichier chargé (empreinte MD5, lignes lues, lignes et total annoncés).
      - name: soldes_comptables
        description: >
          Soldes comptables journaliers par filiale (grand livre) : référence indépendante pour le
          rapprochement des opérations nettoyées (test assert_rapprochement_comptable).
      - name: ancrages_zf
        description: >
          Encours de dépôts à vue réels par pays (BCE, Fed, Banque du Canada, SCB, Danmarks Nationalbank,
          FMI, BEAC) x part de marché de ZF Banque, aux dates de publication (data/sources/).
        tests:
          - unicite_combinee:
              arguments: {colonnes: [code_filiale, date_ancrage]}
        columns:
          - name: encours_zf_devise
            tests:
              - not_null
              - entre_bornes:
                  arguments: {min_value: 0}
      - name: paysim_transactions
        description: >
          Logs PaySim (Kaggle ealaxi/paysim1) : 6,36 M de transactions mobiles simulées sur 743 heures.
          Utilisés comme « texture » des opérations (types, montants, heures, fraude) et pour la page Qualité.
          Jeu de données historique figé (2017) : pas de contrôle de fraîcheur.
        columns:
          - name: id_ligne
            tests: [unique, not_null]
          - name: step
            tests: [not_null]
          - name: type
            tests:
              - accepted_values:
                  arguments:
                    values: [CASH_IN, CASH_OUT, DEBIT, PAYMENT, TRANSFER]
      - name: bce_taux_change
        description: Cours de référence BCE (unités de devise pour 1 EUR), format long.
        # Fraîcheur : la BCE publie chaque jour ouvré. Un export Webstat de plus de 10 jours doit
        # être rafraîchi avant une restitution (dbt source freshness).
        loaded_at_field: "cast(date_cours as timestamp)"
        freshness:
          warn_after: {count: 10, period: day}
        columns:
          - name: date_cours
            tests: [not_null]
          - name: code_devise
            tests: [not_null]

  - name: ml
    description: Sorties du module de prévision Python (etl/prevision.py).
    schema: ml
    tables:
      - name: prevision_tresorerie_quotidienne
        description: Projection Monte-Carlo de la position de trésorerie par filiale (quantiles P5/P50/P95).
      - name: prevision_change
        description: Projection Monte-Carlo des taux de change (quantiles P5/P50/P95).
      - name: backtest_prevision
        description: Précision des modèles de flux (3 origines de backtest, horizon d'un mois).
      - name: controle_depots_reels
        description: Encours réels de janvier 2026 (publiés après la date d'arrêté) vs fourchette prévue.
      - name: reserve_optimale
        description: Réserve de liquidité requise (P99) issue de la simulation vs réserve actuelle, et gain associé.
