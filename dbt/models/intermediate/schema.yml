version: 2

models:
  - name: int_taux_change_journalier
    description: Taux EUR->devise pour chaque jour calendaire (report des week-ends, parités fixes CFA).
    tests:
      - unicite_combinee:
          arguments:
            colonnes: [date_cours, code_devise]

  - name: int_encours_initial
    description: Encours de dépôts réel (x part de marché) et réserve de liquidité de chaque filiale au 31/12/2022.
    columns:
      - name: code_filiale
        tests: [unique, not_null]
      - name: taux_reference
        tests: [not_null]

  - name: int_mouvements_tresorerie
    description: >
      Une ligne par flux (représentant nb_operations opérations), valorisée en devise locale et en EUR
      au cours du jour. Vue (non matérialisée) car volumineuse : elle est agrégée dans fct_flux_tresorerie_horaire.
    columns:
      - name: sens
        tests:
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false
