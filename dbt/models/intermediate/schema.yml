version: 2

models:
  - name: int_operations_controlees
    description: >
      Union des 4 systèmes sources avec indicateurs de qualité et motif de rejet (règles RG-NET-05 à 10).
      Toutes les lignes brutes y figurent : rien n'est supprimé en silence.
    columns:
      - name: id_ligne_source
        tests: [unique, not_null]
      - name: motif_rejet
        tests:
          - accepted_values:
              arguments:
                values: ['Filiale inconnue', 'Doublon', 'Opération annulée', 'Compte de test', 'Extourne',
                         'Écriture extournée', 'Libellé inconnu', 'Date invalide', 'Montant invalide',
                         'Devise incohérente', 'Sens incohérent']

  - name: int_operations_nettoyees
    description: Opérations retenues après nettoyage, au format unique du groupe, avec leur lignage source.
    columns:
      - name: ref_operation
        tests: [unique, not_null]
      - name: code_type
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('ref_types_transaction'), field: code_type}
      - name: code_filiale
        tests: [not_null]

  - name: int_operations_rejetees
    description: Lignes brutes écartées par le nettoyage, avec leur motif (audit, retour aux filiales).

  - name: int_taux_change_journalier
    description: Taux EUR->devise pour chaque jour calendaire (report des week-ends, parités fixes CFA).
    tests:
      - unicite_combinee:
          arguments:
            colonnes: [date_cours, code_devise]

  - name: int_encours_initial
    description: Encours de dépôts réel (x part de marché) et réserve de liquidité de chaque filiale au 31/12/2022.
    columns:
      - name: code_filiale
        tests: [unique, not_null]
      - name: taux_reference
        tests: [not_null]

  - name: int_mouvements_tresorerie
    description: >
      Une ligne par flux (représentant nb_operations opérations), valorisée en devise locale et en EUR
      au cours du jour. Vue (non matérialisée) car volumineuse : elle est agrégée dans fct_flux_tresorerie_horaire.
    columns:
      - name: sens
        tests:
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false
