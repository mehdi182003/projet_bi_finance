version: 2

models:
  - name: int_filiales_affectation
    description: Plages de seaux de hachage (0-9999) attribuées à chaque filiale au prorata de sa clientèle.
    columns:
      - name: code_filiale
        tests: [unique, not_null]

  - name: int_taux_change_journalier
    description: Taux EUR->devise pour chaque jour calendaire (report des week-ends, parités fixes CFA).
    tests:
      - unicite_combinee:
          arguments:
            colonnes: [date_cours, code_devise]

  - name: int_encours_initial
    description: Encours de dépôts et réserve de liquidité de chaque filiale au premier jour.
    columns:
      - name: code_filiale
        tests: [unique, not_null]
      - name: taux_reference
        tests: [not_null]

  - name: int_mouvements_tresorerie
    description: >
      Une ligne par jambe de trésorerie (émetteur / bénéficiaire), rattachée à une filiale,
      valorisée en devise locale et en EUR au cours du jour. Vue (non matérialisée) car
      volumineuse : elle est agrégée dans fct_flux_tresorerie_horaire.
    columns:
      - name: sens
        tests:
          - accepted_values:
              arguments:
                values: [1, -1]
                quote: false
