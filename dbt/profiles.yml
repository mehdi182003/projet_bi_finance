# Profil de connexion dbt. Les valeurs viennent des variables d'environnement
# (fichier .env chargé par pipeline.py). Utilisation : dbt <commande> --profiles-dir .
cresus:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'cresus') }}"
      schema: public
      threads: 4
